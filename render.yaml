services:
  - type: web
    name: synam-mystic-phoenix
    env: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: FREE_MODELS_ONLY
        value: "true"
      - key: DEFAULT_AI_PROVIDER
        value: "auto"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "openrouter/free"
