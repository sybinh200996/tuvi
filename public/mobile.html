<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#06112b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Đặng Năm Mystic" />
  <meta name="description" content="Đặng Năm Mystic NAM46 - trợ lý AI chuyên nghiệp, AI chat, tử vi, chỉ tay, xem tướng và công cụ tham khảo trên mobile." />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" />
  <link rel="stylesheet" href="mobile-style.css?v=1792540000" />
  <title>Đặng Năm Mystic Mobile</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body>
  <!-- Mobile Sticky Top Language Bar -->
  <header class="mobile-top-lang-bar">
    <span class="mobile-top-brand">ĐẶNG NĂM MYSTIC</span>
    <div class="mobile-lang-group" title="Ngôn ngữ / Language / 语言">
      <button type="button" class="m-lang-btn active" data-lang="vi" onclick="selectAppLanguage('vi')">🇻🇳 VI</button>
      <button type="button" class="m-lang-btn" data-lang="en" onclick="selectAppLanguage('en')">🇬🇧 EN</button>
      <button type="button" class="m-lang-btn" data-lang="zh" onclick="selectAppLanguage('zh')">🇨🇳 中文</button>
    </div>
    <a href="index.html?desktop=1" class="m-desktop-btn" data-i18n="mobile_back_desktop">🖥️ Máy tính</a>
  </header>

  <div id="stars">
    <div class="star-cluster star-cluster-1"></div>
    <div class="star-cluster star-cluster-2"></div>
    <div class="meteor meteor-1"></div>
    <div class="meteor meteor-2"></div>
    <div class="meteor meteor-3"></div>
  </div>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="i18n.js?v=1792540000"></script><script src="mystic-engine.js"></script><script src="sync-speech.js?v=1792540000"></script><script src="mobile-app.compiled.js?v=1792540000"></script>
<script>/* NAM45 mobile back desktop */ window.SYNAM_DESKTOP_URL="index.html?desktop=1";</script>
<script>
  function selectAppLanguage(lang) {
    if (window.I18nEngine) {
      window.I18nEngine.setLanguage(lang);
    }
  }
  document.addEventListener('DOMContentLoaded', function() {
    if (window.I18nEngine) {
      var cur = window.I18nEngine.getCurrentLang();
      window.I18nEngine.applyTranslations(cur);
      window.I18nEngine.updateLanguageSelectorUI(cur);
    }
  });
</script>
</body>
</html>
